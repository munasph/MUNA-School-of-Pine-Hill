<div class="admin-page">
  <a routerLink="/admin/announcements" class="admin-back-link">
    <lucide-icon [img]="arrowLeft" size="16"></lucide-icon>
    Back to announcements
  </a>

  <header class="admin-page__header">
    <div>
      <p class="admin-page__eyebrow">Announcements</p>
      <h2 class="admin-page__title">Create announcement</h2>
      <p class="admin-page__subtitle">Shown on the home page. Visitors can open the full announcement on its own page.</p>
    </div>
  </header>

  <p *ngIf="error" class="admin-alert admin-alert--error">{{ error }}</p>

  <section class="admin-detail-card admin-detail-card--full">
    <form [formGroup]="form" (ngSubmit)="submit()" class="admin-form">
      <label class="admin-field">
        <span class="admin-field__label">Title *</span>
        <input class="admin-field__input" type="text" formControlName="title" />
      </label>

      <label class="admin-field">
        <span class="admin-field__label">Summary</span>
        <input class="admin-field__input" type="text" formControlName="subtitle" />
        <span class="admin-field__hint">Short preview shown on the home page</span>
      </label>

      <label class="admin-field">
        <span class="admin-field__label">Full details</span>
        <textarea class="admin-field__textarea" rows="8" formControlName="body"></textarea>
        <span class="admin-field__hint">Shown on the announcement detail page</span>
      </label>

      <label class="admin-field">
        <span class="admin-field__label">Related link label</span>
        <input class="admin-field__input" type="text" formControlName="cta" />
      </label>

      <label class="admin-field">
        <span class="admin-field__label">Related link URL</span>
        <input class="admin-field__input" type="text" formControlName="href" />
        <span class="admin-field__hint">Optional — e.g. /admission or an external URL</span>
      </label>

      <label class="admin-field admin-field--checkbox">
        <input type="checkbox" formControlName="active" />
        <span class="admin-field__label">Show on public site</span>
      </label>

      <button type="submit" class="admin-btn admin-btn--accent" [disabled]="submitting">
        {{ submitting ? 'Creating…' : 'Create announcement' }}
      </button>
    </form>
  </section>
</div>
