<div class="auth-page">
  <section class="auth-section">
    <div class="max-w-md mx-auto px-4">
      <div class="text-center mb-12">
        <app-section-label>Admin</app-section-label>
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your email and we will send a reset link if an account exists.</p>
      </div>

      <app-glass-card intensity="mid" extraClass="p-8 lg:p-10">
        <ng-container *ngIf="submitted; else resetForm">
          <p class="auth-subtitle text-center">{{ successMessage }}</p>
          <a routerLink="/login" class="block text-center mt-6"><app-glass-button variant="secondary">Back to Login</app-glass-button></a>
        </ng-container>

        <ng-template #resetForm>
          <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
            <app-glass-input label="Email" type="email" placeholder="you@example.com"
                             [required]="true" formControlName="email"
                             [error]="errorFor('email') ?? undefined"></app-glass-input>
            <p *ngIf="submitError" class="field-error text-center">{{ submitError }}</p>
            <app-glass-button variant="accent" size="lg" type="submit" extraClass="w-full" [disabled]="submitting">
              {{ submitting ? 'Sending…' : 'Send Reset Link' }}
            </app-glass-button>
          </form>
          <p class="auth-switch"><a routerLink="/login" class="auth-switch__link">Back to login</a></p>
        </ng-template>
      </app-glass-card>
    </div>
  </section>
</div>
