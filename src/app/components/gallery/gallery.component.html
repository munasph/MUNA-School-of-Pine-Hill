<div>
  <!-- Hero -->
  <section class="gallery-hero">
    <div aria-hidden="true" class="gallery-hero__dots"></div>

    <div class="max-w-7xl mx-auto px-4 relative">
      <span class="gallery-hero__tag">{{ t.gallery.hero.tag }}</span>

      <h1 class="font-serif font-bold mb-4 gallery-hero__title">
        {{ t.gallery.hero.title }}
      </h1>

      <p class="gallery-hero__subtitle">{{ t.gallery.hero.subtitle }}</p>

      <p class="gallery-hero__meta">
        {{ allImages.length }} photos across {{ galleryCategories.length - 1 }} categories
      </p>
    </div>
  </section>

  <!-- Filter Bar -->
  <div class="gallery-filter-wrap">
    <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto gallery-filter">
      <lucide-icon [img]="filterIcon" size="15" class="shrink-0 gallery-filter__icon"></lucide-icon>

      <button *ngFor="let cat of galleryCategories"
              type="button"
              (click)="setFilter(cat)"
              class="gallery-filter__btn"
              [class.gallery-filter__btn--active]="activeFilter === cat">
        {{ categoryLabel(cat) }}
      </button>

      <span class="ml-auto shrink-0 text-xs font-semibold gallery-filter__count">
        {{ filtered.length }} photos
      </span>
    </div>
  </div>

  <!-- Photo Grid -->
  <section class="py-16 gallery-grid-section">
    <div class="max-w-7xl mx-auto px-4">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div *ngFor="let img of filtered; let i = index; trackBy: trackImage"
             appReveal
             [revealDelay]="i * 40"
             class="group relative overflow-hidden cursor-pointer aspect-[4/3] gallery-card"
             (click)="open(i)">
          <img [src]="img.src" [alt]="img.label"
               class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
               referrerpolicy="no-referrer" />
          <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4 gallery-card__overlay">
            <span class="font-bold text-sm gallery-card__label">{{ img.label }}</span>
            <span class="text-[10px] uppercase tracking-widest font-bold mt-0.5 gallery-card__category">
              {{ img.category }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Video Highlights -->
  <section class="py-20 gallery-videos">
    <div class="max-w-7xl mx-auto px-4">
      <div class="text-center mb-12">
        <span class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest mb-4 gallery-videos__tag">
          <span class="gallery-videos__tag-line"></span>
          Watch &amp; Explore
          <span class="gallery-videos__tag-line"></span>
        </span>
        <h2 class="font-serif font-bold gallery-videos__title">School Highlights</h2>
      </div>

      <div class="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
        <div *ngFor="let v of videoHighlights"
             class="group cursor-pointer transition-transform duration-300 hover:-translate-y-1">
          <div class="aspect-video overflow-hidden relative gallery-video">
            <img [src]="videoThumb(v.seed)" [alt]="v.title"
                 class="w-full h-full object-cover" referrerpolicy="no-referrer" />
            <div class="absolute inset-0 flex items-center justify-center gallery-video__overlay">
              <div class="w-14 h-14 rounded-full flex items-center justify-center shadow-xl transition-transform duration-200 group-hover:scale-110 gallery-video__play">
                <lucide-icon [img]="playIcon" size="22" class="gallery-video__play-icon"></lucide-icon>
              </div>
            </div>
          </div>
          <h4 class="font-bold mt-3 text-sm gallery-video__title">{{ v.title }}</h4>
        </div>
      </div>
    </div>
  </section>

  <app-lightbox [images]="filtered" [selectedIndex]="selectedIndex"
                (close)="close()" (prev)="prev()" (next)="next()"></app-lightbox>
</div>
