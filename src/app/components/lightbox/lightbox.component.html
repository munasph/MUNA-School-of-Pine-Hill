<div *ngIf="selectedIndex !== null"
     class="lightbox"
     (click)="onClose()"
     tabindex="0">

  <button class="lightbox__close"
          type="button"
          aria-label="Close"
          (click)="onClose(); $event.stopPropagation()">
    <lucide-icon [img]="x" size="22"></lucide-icon>
  </button>

  <button class="lightbox__nav lightbox__nav--prev"
          type="button"
          aria-label="Previous image"
          (click)="prev.emit(); $event.stopPropagation()">
    <lucide-icon [img]="chevronLeft" size="24"></lucide-icon>
  </button>

  <button class="lightbox__nav lightbox__nav--next"
          type="button"
          aria-label="Next image"
          (click)="next.emit(); $event.stopPropagation()">
    <lucide-icon [img]="chevronRight" size="24"></lucide-icon>
  </button>

  <div class="lightbox__content" (click)="$event.stopPropagation()">
    <img *ngIf="image"
         [src]="image.src"
         [alt]="image.label"
         class="lightbox__image" />
    <span *ngIf="image" class="lightbox__caption">{{ image.label }}</span>
  </div>
</div>
