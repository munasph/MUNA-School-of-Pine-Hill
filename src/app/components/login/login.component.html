<ng-container *ngIf="submitted; else loginForm">
  <div class="min-h-[80vh] flex items-center justify-center px-4">
    <app-glass-card intensity="strong" extraClass="text-center max-w-md p-12">
      <div class="success-icon">
        <lucide-icon [img]="checkCircle" size="32" class="text-white"></lucide-icon>
      </div>
      <h2 class="text-3xl font-serif success-title">{{ t.login.success.title }}</h2>
      <p class="success-message leading-relaxed">{{ successMessage || t.login.success.message }}</p>
      <a routerLink="/">
        <app-glass-button variant="secondary">&larr; Return to Home</app-glass-button>
      </a>
    </app-glass-card>
  </div>
</ng-container>

<ng-template #loginForm>
  <div>
    <section class="py-24">
      <div class="max-w-md mx-auto px-4">
        <div class="text-center mb-12">
          <app-section-label>{{ t.login.hero.tag }}</app-section-label>
          <h1 class="text-4xl lg:text-5xl font-serif form-title">{{ t.login.hero.title }}</h1>
          <p class="form-subtitle">{{ t.login.hero.subtitle }}</p>
        </div>

        <app-glass-card intensity="mid" extraClass="p-8 lg:p-10">
          <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
            <app-glass-input [label]="t.login.form.email" type="email"
                             placeholder="you@example.com"
                             [required]="true" formControlName="email"
                             [error]="errorFor('email') ?? undefined"></app-glass-input>

            <app-glass-input [label]="t.login.form.password" type="password"
                             placeholder="Enter your password"
                             [required]="true" formControlName="password"
                             [error]="errorFor('password') ?? undefined"></app-glass-input>

            <app-glass-button variant="accent" size="lg" type="submit"
                              extraClass="w-full" [disabled]="submitting">
              {{ t.login.form.submit }}
            </app-glass-button>
          </form>

          <p class="auth-switch">
            {{ t.login.form.noAccount }}
            <a routerLink="/signup" class="auth-switch__link">{{ t.login.form.signup }}</a>
          </p>
        </app-glass-card>
      </div>
    </section>
  </div>
</ng-template>
