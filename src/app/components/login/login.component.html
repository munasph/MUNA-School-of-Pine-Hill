<div>
  <section class="py-24">
    <div class="max-w-md mx-auto px-4">
      <div class="text-center mb-12">
        <app-section-label>{{ t.login.hero.tag }}</app-section-label>
        <h1 class="text-4xl lg:text-5xl font-serif form-title">{{ t.login.hero.title }}</h1>
        <p class="form-subtitle">{{ t.login.hero.subtitle }}</p>
      </div>

      <app-glass-card intensity="mid" extraClass="p-8 lg:p-10">
        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
          <app-glass-input [label]="t.login.form.email" type="email"
                           placeholder="you@example.com"
                           [required]="true" formControlName="email"
                           [error]="errorFor('email') ?? undefined"></app-glass-input>

          <app-glass-input [label]="t.login.form.password" type="password"
                           placeholder="Enter your password"
                           [required]="true" formControlName="password"
                           [error]="errorFor('password') ?? undefined"></app-glass-input>

          <p class="auth-forgot">
            <a routerLink="/forgot-password" class="auth-switch__link">Forgot password?</a>
          </p>

          <p *ngIf="submitError" class="field-error text-center">{{ submitError }}</p>

          <app-glass-button variant="accent" size="lg" type="submit"
                            extraClass="w-full" [disabled]="submitting">
            {{ submitting ? 'Signing in…' : t.login.form.submit }}
          </app-glass-button>
        </form>

        <p class="auth-switch auth-switch--staff">
          {{ t.login.form.familyPrompt }}
          <a routerLink="/portal" class="auth-switch__link">{{ t.login.form.familyLink }}</a>
        </p>
        <p class="auth-switch">
          Need staff access?
          <a routerLink="/staff-signup" class="auth-switch__link">Request access</a>
        </p>
      </app-glass-card>
    </div>
  </section>
</div>
