<nav class="navbar-shell fixed top-0 left-0 right-0 w-full z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div [ngClass]="lightSurface
            ? 'mx-auto flex w-full md:w-fit items-center justify-between md:justify-start gap-6 md:gap-8'
            : 'flex justify-between items-center gap-6'"
         class="navbar-inner"
         [style.marginTop]="lightSurface ? '12px' : '0'"
         [style.padding]="lightSurface ? '12px 0' : '16px 0'">

      <!-- LEFT: Logo -->
      <a routerLink="/" class="logo-link flex items-center gap-3 flex-shrink-0
                                hover:opacity-85 transition-opacity duration-300 group">
        <picture>
          <source srcset="/assets/logo-full.webp" type="image/webp" />
          <img src="/assets/logo-full.png"
               [alt]="schoolInfo.name"
               class="h-12 w-auto object-contain group-hover:scale-105 transition-transform duration-300" />
        </picture>
        <div class="hidden sm:flex flex-col justify-center gap-0 navbar-brand-text"
             [style.maxWidth]="scrolled ? '0' : '200px'"
             [style.opacity]="scrolled ? 0 : 1">
          <span class="font-bold text-sm leading-snug" [style.color]="brandTitleColor()">
            {{ schoolInfo.shortName }}
          </span>
          <span class="font-semibold text-xs leading-snug" [style.color]="brandSubtitleColor()">
            {{ schoolInfo.name }}
          </span>
        </div>
      </a>

      <!-- CENTER: Liquid Glass Pill -->
      <div class="hidden md:flex items-center gap-1 navbar-pill"
           [style.background]="pillBackground()"
           [style.border]="pillBorder()"
           [style.boxShadow]="pillShadow()">
        <a *ngFor="let link of navLinks"
           [routerLink]="link.path"
           class="liquid-nav-link"
           [style.color]="linkColor(isActive(link.path))">
          <div class="liquid-nav-link__inner px-4 py-2 rounded-3xl text-sm font-semibold
                      transition-all duration-300 relative cursor-pointer hover:scale-[1.05] active:scale-[0.98]"
               [style.background]="linkBackground(isActive(link.path))">
            {{ navLinkLabel(link.key) }}
          </div>
        </a>
      </div>

      <!-- RIGHT: Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="hidden md:flex items-center gap-1 navbar-pill"
             [style.background]="pillBackground()"
             [style.border]="pillBorder()"
             [style.boxShadow]="pillShadow()">
          <button type="button"
                  class="liquid-nav-link"
                  [style.color]="linkColor(false)">
            <div class="liquid-nav-link__inner px-4 py-2 rounded-3xl text-sm font-semibold
                        transition-all duration-300 relative cursor-pointer
                        hover:scale-[1.05] active:scale-[0.98]"
                 [style.background]="linkBackground(false)">
              Log in
            </div>
          </button>
          <button type="button"
                  class="liquid-nav-link"
                  [style.color]="linkColor(false)">
            <div class="liquid-nav-link__inner px-4 py-2 rounded-3xl text-sm font-semibold
                        transition-all duration-300 relative cursor-pointer
                        hover:scale-[1.05] active:scale-[0.98]"
                 [style.background]="linkBackground(false)">
              Sign up
            </div>
          </button>
        </div>

        <a routerLink="/admission"
           class="btn-admission hidden sm:block px-6 py-2.5 rounded-full font-semibold text-sm cursor-pointer text-white">
          {{ t.nav.admission }}
        </a>

        <app-theme-toggle></app-theme-toggle>

        <button type="button"
                class="p-2 md:hidden hover:opacity-70 transition-opacity cursor-pointer"
                [style.color]="burgerColor()"
                aria-label="Toggle menu"
                [attr.aria-expanded]="isOpen"
                (click)="toggle()">
          <lucide-icon *ngIf="!isOpen" [img]="menuIcon" size="24"></lucide-icon>
          <lucide-icon *ngIf="isOpen"  [img]="closeIcon" size="24"></lucide-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div *ngIf="isOpen"
       class="md:hidden overflow-hidden navbar-mobile"
       [ngClass]="lightSurface ? 'navbar-mobile--light' : 'navbar-mobile--dark'">
    <div class="px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-2">
      <a *ngFor="let link of navLinks"
         [routerLink]="link.path"
         (click)="isOpen = false"
         class="px-4 py-3 rounded-lg font-semibold text-base transition-all duration-200 cursor-pointer"
         [ngClass]="isActive(link.path) ? 'navbar-mobile__link--active' : 'navbar-mobile__link--inactive'">
        {{ navLinkLabel(link.key) }}
      </a>

      <div class="my-2 h-px navbar-mobile__divider"></div>

      <div class="grid grid-cols-2 gap-2">
        <button type="button"
                (click)="isOpen = false"
                class="px-4 py-3 rounded-lg text-center font-semibold cursor-pointer border-2 transition-colors navbar-mobile__login">
          Log in
        </button>
        <button type="button"
                (click)="isOpen = false"
                class="px-4 py-3 rounded-lg text-center font-semibold cursor-pointer border-2 transition-colors navbar-mobile__signup">
          Sign up
        </button>
      </div>

      <a routerLink="/admission"
         (click)="isOpen = false"
         class="mt-1 px-4 py-3 rounded-lg text-center font-bold shadow-lg cursor-pointer navbar-mobile__admission">
        Admission
      </a>
    </div>
  </div>
</nav>
