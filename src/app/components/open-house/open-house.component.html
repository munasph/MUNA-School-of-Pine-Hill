<div class="open-house-page">
  <section class="open-house-section">
    <div class="open-house-container">
      <div class="open-house-header">
        <app-section-label>{{ t.badge }}</app-section-label>
        <h1 class="open-house-title">{{ t.title }}</h1>
        <p class="open-house-subtitle">{{ t.subtitle }}</p>
        <p class="open-house-dates">{{ t.openHouseDates }}</p>

        <div class="open-house-actions">
          <a [routerLink]="t.ctaPath" class="open-house-cta">{{ t.ctaLabel }} →</a>
          <a routerLink="/" class="open-house-secondary">Back to Home</a>
        </div>
      </div>

      <figure class="open-house-flyer-card">
        <img [src]="t.flyerSrc"
             [alt]="t.flyerAlt"
             class="open-house-flyer"
             width="1024"
             height="576"
             loading="eager" />
      </figure>
    </div>
  </section>
</div>
