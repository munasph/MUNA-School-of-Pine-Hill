<div>
  <section class="py-24">
    <div class="max-w-md mx-auto px-4">
      <div class="text-center mb-12">
        <app-section-label>{{ t.tag }}</app-section-label>
        <h1 class="text-4xl lg:text-5xl font-serif form-title">{{ t.title }}</h1>
        <p class="form-subtitle">{{ t.subtitle }}</p>
      </div>

      <app-glass-card intensity="mid" extraClass="p-8 lg:p-10">
        <p *ngIf="message" class="portal-alert portal-alert--success">{{ message }}</p>

        <form *ngIf="!message" [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
          <app-glass-input [label]="t.email" type="email"
                           placeholder="you@example.com"
                           [required]="true" formControlName="email"
                           [error]="errorFor('email') ?? undefined"></app-glass-input>

          <app-glass-button variant="accent" size="lg" type="submit"
                            extraClass="w-full" [disabled]="submitting">
            {{ submitting ? 'Sending…' : t.submit }}
          </app-glass-button>
        </form>

        <p class="auth-switch">
          <a routerLink="/portal/login" class="auth-switch__link">{{ t.back }}</a>
        </p>
      </app-glass-card>
    </div>
  </section>
</div>
