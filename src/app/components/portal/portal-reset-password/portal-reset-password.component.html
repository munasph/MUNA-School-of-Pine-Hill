<div>
  <section class="py-24">
    <div class="max-w-md mx-auto px-4">
      <div class="text-center mb-12">
        <app-section-label>{{ t.tag }}</app-section-label>
        <h1 class="text-4xl lg:text-5xl font-serif form-title">{{ t.title }}</h1>
      </div>

      <app-glass-card intensity="mid" extraClass="p-8 lg:p-10">
        <ng-container *ngIf="done; else resetForm">
          <p class="portal-alert portal-alert--success">Password updated. You can now log in.</p>
          <a routerLink="/portal/login" class="auth-switch__link">{{ t.successCta }}</a>
        </ng-container>

        <ng-template #resetForm>
          <p *ngIf="errorMessage" class="portal-alert portal-alert--error">{{ errorMessage }}</p>

          <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
            <app-glass-input [label]="t.password" type="password"
                             placeholder="At least 8 characters"
                             [required]="true" formControlName="password"
                             [error]="errorFor('password') ?? undefined"></app-glass-input>

            <app-glass-input [label]="t.confirmPassword" type="password"
                             placeholder="Repeat password"
                             [required]="true" formControlName="confirmPassword"
                             [error]="errorFor('confirmPassword') ?? undefined"></app-glass-input>

            <app-glass-button variant="accent" size="lg" type="submit"
                              extraClass="w-full" [disabled]="submitting">
              {{ submitting ? 'Updating…' : t.submit }}
            </app-glass-button>
          </form>
        </ng-template>
      </app-glass-card>
    </div>
  </section>
</div>
