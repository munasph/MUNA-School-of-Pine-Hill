<div class="auth-page">
  <section class="auth-section">
    <div class="max-w-md mx-auto px-4">
      <div class="text-center mb-12">
        <app-section-label>Admin</app-section-label>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Choose a new password for your admin account.</p>
      </div>

      <app-glass-card intensity="mid" extraClass="p-8 lg:p-10">
        <ng-container *ngIf="submitted; else passwordForm">
          <p class="auth-subtitle text-center">Password reset successfully. Redirecting to login…</p>
        </ng-container>

        <ng-template #passwordForm>
          <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" novalidate>
            <app-glass-input label="New Password" type="password"
                             placeholder="At least 8 characters"
                             [required]="true" formControlName="password"
                             [error]="errorFor('password') ?? undefined"></app-glass-input>
            <app-glass-input label="Confirm Password" type="password"
                             placeholder="Re-enter your password"
                             [required]="true" formControlName="confirmPassword"
                             [error]="errorFor('confirmPassword') ?? undefined"></app-glass-input>
            <p *ngIf="submitError" class="field-error text-center">{{ submitError }}</p>
            <app-glass-button variant="accent" size="lg" type="submit" extraClass="w-full" [disabled]="submitting">
              {{ submitting ? 'Saving…' : 'Reset Password' }}
            </app-glass-button>
          </form>
        </ng-template>
      </app-glass-card>
    </div>
  </section>
</div>
