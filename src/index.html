<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <base href="/" />

    <title>School Name</title>

    <meta name="description" content="School website placeholder. Add your description when ready." />
    <meta name="keywords"    content="school, education, placeholder" />
    <meta name="robots"      content="index, follow" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://example.com/" />
    <meta property="og:title"       content="School Name" />
    <meta property="og:description" content="School website placeholder. Add your description when ready." />
    <meta property="og:image"       content="https://example.com/logo-full.png" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:site_name"   content="School Name" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="School Name" />
    <meta name="twitter:description" content="School website placeholder. Add your description when ready." />
    <meta name="twitter:image"       content="https://example.com/logo-full.png" />

    <meta name="theme-color" content="#141820" />

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "School Name",
      "url": "https://example.com",
      "logo": "https://example.com/logo-full.png",
      "description": "School website placeholder. Add your description when ready.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Street Address",
        "addressLocality": "City",
        "addressRegion": "State",
        "postalCode": "00000",
        "addressCountry": "Country"
      },
      "telephone": "Phone Number",
      "email": "email@example.com"
    }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
